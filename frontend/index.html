<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Multi-Agent AI Assistant</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- React 18, React-DOM, Babel Standalone & Marked -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #0f172a;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-light: rgba(99, 102, 241, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.15);
            --error: #f43f5e;
            --error-bg: rgba(244, 63, 94, 0.15);
            --border-color: #334155;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }

        /* AUTH MODAL */
        .auth-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); width: 420px; max-width: 90vw; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-logo { width: 56px; height: 56px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 16px; }
        .auth-header h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .auth-header p { color: var(--text-muted); font-size: 14px; }
        .auth-tabs { display: flex; background: var(--bg-dark); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 20px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .tab-btn.active { background: var(--primary); color: #ffffff; }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; font-weight: 500; color: var(--text-muted); }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-wrapper i { position: absolute; left: 14px; color: var(--text-dim); }
        .input-wrapper input { width: 100%; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px 14px 12px 40px; color: var(--text-main); font-size: 14px; outline: none; }
        .input-wrapper input:focus { border-color: var(--primary); }
        .error-banner { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; background: var(--error-bg); color: var(--error); border: 1px solid rgba(244, 63, 94, 0.3); }
        .success-banner { padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13px; background: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .primary-btn { background: var(--primary); color: #ffffff; border: none; padding: 12px 20px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .primary-btn:hover { background: var(--primary-hover); }
        .primary-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .full-width { width: 100%; }

        /* APP LAYOUT */
        .app-layout { display: flex; width: 100vw; height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-sidebar); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; gap: 20px; }
        .sidebar-brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { width: 40px; height: 40px; background: var(--primary); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ffffff; }
        .brand-info h3 { font-size: 16px; font-weight: 700; }
        .brand-info span { font-size: 12px; color: var(--text-muted); }
        .user-profile-badge { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 12px; display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 36px; height: 36px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .user-details { display: flex; flex-direction: column; overflow: hidden; }
        .user-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-role { font-size: 11px; color: var(--primary); font-weight: 700; }
        .new-chat-btn { background: var(--primary-light); color: var(--primary); border: 1px dashed var(--primary); padding: 10px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .new-chat-btn:hover { background: var(--primary); color: #ffffff; }
        .sidebar-section { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .section-title { font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .upload-dropzone { border: 2px dashed var(--border-color); border-radius: var(--radius-md); padding: 20px 16px; text-align: center; cursor: pointer; }
        .upload-dropzone:hover { border-color: var(--primary); background: var(--primary-light); }
        .upload-icon { font-size: 24px; color: var(--primary); margin-bottom: 8px; }
        .upload-dropzone p { font-size: 13px; font-weight: 500; }
        .upload-dropzone p span { color: var(--primary); text-decoration: underline; }
        .upload-status-banner { background: var(--primary-light); border: 1px solid var(--primary); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .spinner-small { width: 14px; height: 14px; border: 2px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .doc-list-header { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-top: 8px; }
        .doc-list { display: flex; flex-direction: column; gap: 6px; }
        .doc-item { background: var(--bg-card); padding: 8px 10px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); }
        .logout-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px; width: 100%; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .logout-btn:hover { background: var(--error-bg); color: var(--error); border-color: var(--error); }

        /* CHAT VIEWPORT */
        .chat-viewport { flex: 1; display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-header { height: 60px; border-bottom: 1px solid var(--border-color); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); }
        .status-indicator.online { width: 8px; height: 8px; background: var(--success); border-radius: 50%; }
        .header-badges { display: flex; gap: 8px; }
        .badge { background: var(--bg-card); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 20px; font-size: 11px; color: var(--text-muted); }
        .activity-panel { background: #111827; border-bottom: 1px solid var(--border-color); padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; }
        .activity-header { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; color: var(--primary); }
        .activity-steps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
        .step-chip { background: var(--bg-card); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 12px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
        .step-chip.active { border-color: var(--primary); color: var(--text-main); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .welcome-card { max-width: 600px; margin: 40px auto; text-align: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 32px; }
        .welcome-icon { font-size: 40px; color: var(--primary); margin-bottom: 16px; }
        .welcome-card h2 { font-size: 22px; margin-bottom: 8px; }
        .welcome-card p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        .quick-prompts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .quick-prompts button { background: var(--bg-dark); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .quick-prompts button:hover { border-color: var(--primary); color: var(--primary); }
        .message-row { display: flex; gap: 14px; max-width: 85%; }
        .message-row.user-row { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.assistant-row { align-self: flex-start; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .user-row .avatar { background: var(--primary); color: #ffffff; }
        .assistant-row .avatar { background: #0284c7; color: #ffffff; }
        .bubble { background: var(--bg-card); border: 1px solid var(--border-color); padding: 14px 18px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.6; }
        .user-row .bubble { background: var(--primary); border: none; color: #ffffff; }
        .route-badge { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }
        .chat-input-container { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--bg-dark); }
        .input-form { display: flex; gap: 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 8px 12px; }
        .input-form textarea { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 14px; outline: none; resize: none; font-family: inherit; padding: 8px 0; }
        .send-btn { background: var(--primary); color: #ffffff; border: none; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; align-self: flex-end; }
        .input-footer { text-align: center; margin-top: 8px; font-size: 11px; color: var(--text-dim); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const API_BASE_URL = window.location.origin;

        function App() {
            const [token, setToken] = useState(localStorage.getItem("nexa_token") || "");
            const [user, setUser] = useState(JSON.parse(localStorage.getItem("nexa_user") || "null"));
            const [activeTab, setActiveTab] = useState("login");
            const [username, setUsername] = useState("");
            const [email, setEmail] = useState("");
            const [password, setPassword] = useState("");
            const [error, setError] = useState(null);
            const [successMsg, setSuccessMsg] = useState(null);
            const [loading, setLoading] = useState(false);

            const [sessionId, setSessionId] = useState("session_" + Math.floor(Math.random() * 1000000));
            const [messages, setMessages] = useState([]);
            const [documents, setDocuments] = useState([]);
            const [activitySteps, setActivitySteps] = useState([]);
            const [isSending, setIsSending] = useState(false);
            const [uploadStatus, setUploadStatus] = useState(null);
            const [inputMessage, setInputMessage] = useState("");
            const fileInputRef = useRef(null);
            const chatCanvasRef = useRef(null);

            useEffect(() => {
                if (token && user) fetchDocs();
            }, [token]);

            useEffect(() => {
                const validateSession = async () => {
                    if (!token) return;
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/auth/me`, {
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        if (!res.ok) handleLogout();
                    } catch (e) {
                        handleLogout();
                    }
                };
                validateSession();
            }, []);

            useEffect(() => {
                if (chatCanvasRef.current) {
                    chatCanvasRef.current.scrollTop = chatCanvasRef.current.scrollHeight;
                }
            }, [messages]);

            const fetchDocs = async () => {
                try {
                    const res = await fetch(`${API_BASE_URL}/api/documents`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });
                    if (res.status === 401) {
                        handleLogout();
                        return;
                    }
                    if (res.ok) setDocuments(await res.json());
                } catch (e) {}
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setError(null);
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE_URL}/api/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || data.detail || "Unable to sign in.");
                    setToken(data.access_token);
                    setUser(data.user);
                    localStorage.setItem("nexa_token", data.access_token);
                    localStorage.setItem("nexa_user", JSON.stringify(data.user));
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setError(null);
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE_URL}/api/auth/register`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, email, password, role: "user" })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || data.detail || "Registration failed.");
                    setToken(data.access_token);
                    setUser(data.user);
                    localStorage.setItem("nexa_token", data.access_token);
                    localStorage.setItem("nexa_user", JSON.stringify(data.user));
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = () => {
                localStorage.removeItem("nexa_token");
                localStorage.removeItem("nexa_user");
                setToken("");
                setUser(null);
                setDocuments([]);
                setMessages([]);
            };

            const handleUploadPDF = async (file) => {
                if (!file || file.type !== "application/pdf") return alert("Only PDF files allowed.");
                setUploadStatus(`Uploading ${file.name}...`);
                const formData = new FormData();
                formData.append("file", file);
                try {
                    setUploadStatus("Indexing & extracting document chunks...");
                    const res = await fetch(`${API_BASE_URL}/api/documents/upload`, {
                        method: "POST",
                        headers: { Authorization: `Bearer ${token}` },
                        body: formData
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || data.detail || "Ingestion failed.");
                    setUploadStatus(`${file.name} is ready! You can now ask questions about it.`);
                    setTimeout(() => setUploadStatus(null), 4000);
                    fetchDocs();
                } catch (err) {
                    setUploadStatus(`Notice: ${err.message}`);
                    setTimeout(() => setUploadStatus(null), 5000);
                }
            };

            const handleSendMessage = async (msgText) => {
                const text = msgText || inputMessage;
                if (!text.trim() || isSending) return;
                setInputMessage("");

                const userMsg = { id: Date.now(), role: "user", content: text };
                const asstId = Date.now() + 1;
                
                // Append ONLY user message to chat canvas on Send. Internal activity events go to ActivityPanel.
                setMessages(prev => [...prev, userMsg]);
                setIsSending(true);
                setActivitySteps(["Evaluating request guardrails..."]);

                let assistantCreated = false;
                let currentRoute = "direct";
                let fullText = "";

                try {
                    const response = await fetch(`${API_BASE_URL}/api/chat/stream`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
                        body: JSON.stringify({ message: text, session_id: sessionId })
                    });
                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({ detail: "Unable to process message." }));
                        throw new Error(errData.error?.message || errData.detail || `Server error (${response.status})`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunkStr = decoder.decode(value);
                        const lines = chunkStr.split("\n");

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (trimmed.startsWith("data: ")) {
                                try {
                                    const payload = JSON.parse(trimmed.substring(6));
                                    const evType = payload.type || payload.event;
                                    if (evType === "status" || evType === "activity") {
                                        if (payload.message) setActivitySteps(prev => [...prev, payload.message]);
                                    } else if (evType === "route" || evType === "route_selected") {
                                        currentRoute = payload.route || "direct";
                                        setActivitySteps(prev => [...prev, `Routed to '${currentRoute.toUpperCase()}' Agent`]);
                                    } else if (evType === "token") {
                                        fullText += (payload.chunk || payload.content || "");
                                        setMessages(prev => {
                                            if (!assistantCreated) {
                                                assistantCreated = true;
                                                return [...prev, { id: asstId, role: "assistant", content: fullText, route: currentRoute, isStreaming: true }];
                                            }
                                            return prev.map(m => m.id === asstId ? { ...m, content: fullText, route: currentRoute, isStreaming: true } : m);
                                        });
                                    } else if (evType === "completed" || evType === "final") {
                                        const finalResp = payload.content || payload.response || fullText;
                                        setActivitySteps(prev => [...prev, "Execution completed."]);
                                        setMessages(prev => {
                                            if (!assistantCreated) {
                                                assistantCreated = true;
                                                return [...prev, { id: asstId, role: "assistant", content: finalResp, route: currentRoute, isStreaming: false }];
                                            }
                                            return prev.map(m => m.id === asstId ? { ...m, content: finalResp, route: currentRoute, isStreaming: false } : m);
                                        });
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (err) {
                    setMessages(prev => {
                        if (!assistantCreated) {
                            return [...prev, { id: asstId, role: "assistant", content: `Notice: ${err.message}`, error: true, isStreaming: false }];
                        }
                        return prev.map(m => m.id === asstId ? { ...m, content: `Notice: ${err.message}`, error: true, isStreaming: false } : m);
                    });
                } finally {
                    setIsSending(false);
                }
            };

            if (!token || !user) {
                return (
                    <div className="auth-modal-overlay">
                        <div className="auth-card">
                            <div className="auth-header">
                                <div className="auth-logo"><i className="fa-solid fa-robot"></i></div>
                                <h2>Enterprise AI Assistant</h2>
                                <p>Sign in or create an employee account</p>
                            </div>
                            <div className="auth-tabs">
                                <button className={`tab-btn ${activeTab === "login" ? "active" : ""}`} onClick={() => { setActiveTab("login"); setError(null); }}>Sign In</button>
                                <button className={`tab-btn ${activeTab === "register" ? "active" : ""}`} onClick={() => { setActiveTab("register"); setError(null); }}>Create Account</button>
                            </div>

                            {error && <div className="error-banner">{error}</div>}
                            {successMsg && <div className="success-banner">{successMsg}</div>}

                            {activeTab === "login" ? (
                                <form className="auth-form" onSubmit={handleLogin}>
                                    <div className="input-group">
                                        <label>Username or Email</label>
                                        <div className="input-wrapper"><i className="fa-solid fa-user"></i><input type="text" placeholder="Username" value={username} onChange={e=>setUsername(e.target.value)} required /></div>
                                    </div>
                                    <div className="input-group">
                                        <label>Password</label>
                                        <div className="input-wrapper"><i className="fa-solid fa-lock"></i><input type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} required /></div>
                                    </div>
                                    <button type="submit" className="primary-btn full-width" disabled={loading}>{loading ? "Signing In..." : "Sign In"}</button>
                                </form>
                            ) : (
                                <form className="auth-form" onSubmit={handleRegister}>
                                    <div className="input-group">
                                        <label>Username</label>
                                        <div className="input-wrapper"><i className="fa-solid fa-user"></i><input type="text" placeholder="Username" value={username} onChange={e=>setUsername(e.target.value)} required /></div>
                                    </div>
                                    <div className="input-group">
                                        <label>Work Email</label>
                                        <div className="input-wrapper"><i className="fa-solid fa-envelope"></i><input type="email" placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)} required /></div>
                                    </div>
                                    <div className="input-group">
                                        <label>Password</label>
                                        <div className="input-wrapper"><i className="fa-solid fa-lock"></i><input type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} required minLength="6" /></div>
                                    </div>
                                    <button type="submit" className="primary-btn full-width" disabled={loading}>{loading ? "Creating..." : "Create Account"}</button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="app-layout">
                    <aside className="sidebar">
                        <div className="sidebar-brand">
                            <div className="brand-logo"><i className="fa-solid fa-brain"></i></div>
                            <div className="brand-info"><h3>Nexa AI</h3><span>Enterprise Assistant</span></div>
                        </div>
                        <div className="user-profile-badge">
                            <div className="user-avatar"><i className="fa-solid fa-user-shield"></i></div>
                            <div className="user-details"><span className="user-name">{user.username}</span><span className="user-role">{user.role.toUpperCase()}</span></div>
                        </div>
                        <button className="new-chat-btn" onClick={() => { setMessages([]); setSessionId("session_" + Math.floor(Math.random() * 1000000)); }}>
                            <i className="fa-solid fa-plus"></i> New Conversation
                        </button>
                        <div className="sidebar-section">
                            <div className="section-title"><i className="fa-solid fa-file-pdf"></i> Document Ingestion</div>
                            <div className="upload-dropzone" onClick={() => fileInputRef.current?.click()}>
                                <i className="fa-solid fa-cloud-arrow-up upload-icon"></i>
                                <p>Drop PDF or <span>Browse</span></p>
                                <small>Auto-indexed into Vector DB</small>
                                <input type="file" ref={fileInputRef} accept="application/pdf" className="hidden" onChange={e => e.target.files[0] && handleUploadPDF(e.target.files[0])} />
                            </div>
                            {uploadStatus && <div className="upload-status-banner"><div className="spinner-small"></div><span>{uploadStatus}</span></div>}
                            <div className="doc-list-header">Indexed Documents ({documents.length})</div>
                            <div className="doc-list">
                                {documents.map(d => (
                                    <div key={d.document_id} className="doc-item">
                                        <i className="fa-solid fa-file-pdf" style={{ color: "#ef4444" }}></i>
                                        <span>{d.filename}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="sidebar-footer">
                            <button className="logout-btn" onClick={handleLogout}><i className="fa-solid fa-right-from-bracket"></i> Sign Out</button>
                        </div>
                    </aside>

                    <main className="chat-viewport">
                        <header className="chat-header">
                            <div className="header-status"><span className="status-indicator online"></span><span>Session: <strong>{sessionId}</strong></span></div>
                            <div className="header-badges"><span className="badge">Groq Llama 3.3 70B</span><span className="badge">ChromaDB RAG</span><span className="badge">PostgreSQL SQL</span></div>
                        </header>

                        {activitySteps.length > 0 && (
                            <div className="activity-panel">
                                <div className="activity-header"><span><i className="fa-solid fa-network-wired"></i> Agent Pipeline</span><button className="close-panel-btn" onClick={() => setActivitySteps([])}>&times;</button></div>
                                <div className="activity-steps">{activitySteps.map((s, i) => <div key={i} className="step-chip active"><i className="fa-solid fa-check"></i> {s}</div>)}</div>
                            </div>
                        )}

                        <div className="chat-messages" ref={chatCanvasRef}>
                            {messages.length === 0 ? (
                                <div className="welcome-card">
                                    <div className="welcome-icon"><i className="fa-solid fa-robot"></i></div>
                                    <h2>Welcome to Enterprise AI Assistant</h2>
                                    <p>Ask company policy questions, search the web, query SQL sales databases, or upload PDFs for auto-ingested RAG analysis.</p>
                                    <div className="quick-prompts">
                                        <button onClick={() => handleSendMessage("What is our company remote work policy?")}>Company Policy</button>
                                        <button onClick={() => handleSendMessage("What is total sales revenue by region?")}>SQL Revenue</button>
                                        <button onClick={() => handleSendMessage("Analyze Q1 sales and compare with recent AI developments.")}>Research Report</button>
                                    </div>
                                </div>
                            ) : (
                                messages.map(m => (
                                    <div key={m.id} className={`message-row ${m.role === "user" ? "user-row" : "assistant-row"}`}>
                                        <div className="avatar"><i className={m.role === "user" ? "fa-solid fa-user" : "fa-solid fa-bot"}></i></div>
                                        <div className="bubble">
                                            {m.route && <div className="route-badge">ROUTE: {m.route.toUpperCase()}</div>}
                                            <div dangerouslySetInnerHTML={{
                                                __html: typeof marked !== "undefined"
                                                    ? marked.parse(m.content).replace(
                                                        /<a href="(\/api\/reports\/download\/[^"]+)">([^<]+)<\/a>/g,
                                                        '<a href="$1" target="_blank" class="primary-btn" style="display:inline-flex;margin-top:10px;text-decoration:none;padding:8px 16px;font-size:12px;"><i class="fa-solid fa-file-pdf"></i> Download PDF Report</a>'
                                                      )
                                                    : m.content
                                            }} />
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        <div className="chat-input-container">
                            <form className="input-form" onSubmit={e => { e.preventDefault(); handleSendMessage(); }}>
                                <textarea value={inputMessage} onChange={e => setInputMessage(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } }} placeholder="Type a message or question..." rows="1" disabled={isSending} />
                                <button type="submit" className="send-btn" disabled={isSending || !inputMessage.trim()}><i className="fa-solid fa-paper-plane"></i></button>
                            </form>
                            <div className="input-footer"><span>Protected by Enterprise Guardrails & SQL Read-Only Validation</span></div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
