name: Enterprise AI Assistant CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Run Linting and Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Python Code Syntax
      run: |
        python -m compileall backend

    - name: Execute Evaluation Benchmark Test Suite
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        DATABASE_URL: "sqlite:///:memory:"
        REDIS_URL: "redis://localhost:6379/0"
        MODEL_NAME: "llama-3.3-70b-versatile"
        APP_NAME: "Enterprise Multi-Agent AI Assistant"
      run: |
        python -c "from backend.app.agents.graph.workflow import create_workflow; print('Workflow Compiled Successfully!')"

  docker-build:
    name: Build Production Docker Image
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Container Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: enterprise-ai-assistant:latest
