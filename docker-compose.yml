version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_ai_assistant_web
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nexa_user:nexa_pass@postgres:5432/nexa_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-""}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-""}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-"true"}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-""}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-"enterprise-ai-assistant"}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_data:/app/.data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: enterprise_ai_postgres
    environment:
      POSTGRES_USER: nexa_user
      POSTGRES_PASSWORD: nexa_pass
      POSTGRES_DB: nexa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa_user -d nexa_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_data:
