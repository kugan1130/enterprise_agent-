services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_ai_assistant_web
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://postgres:1234@postgres:5432/enterprise_ai_db
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-llama-3.1-8b-instant}
      APP_NAME: ${APP_NAME:-Nexa AI Enterprise Assistant}
      JWT_SECRET: ${JWT_SECRET:-enterprise-secret-key-change-in-production-2026}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-enterprise-ai-assistant}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_data:/app/.data
      - ./data/nexatech_documents/documents:/app/data/documents:ro
      - ./backend:/app/backend
      - ./main.py:/app/main.py
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: enterprise_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: enterprise_ai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enterprise_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_data:
